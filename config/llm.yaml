# Which model answers for the Director and the Narrator. The key is NOT here: put MUSE_API_KEY in .env.local
# (git-ignored, see .env.example) or export it in your shell.
#   mode: mock    no network, built-in stand-ins (default; tests and offline play)
#         live    call the models below; a missing key or base_url stops the game with a clear message
#         replay  answer only from the recorded cache (offline, identical to the recorded run); misses fall back
#                 to the template / fixed phrases inside the agents
# Environment overrides: GROWING_LLM (mode), MUSE_BASE_URL, MUSE_API_KEY.
mode: mock
record: true                     # live mode also stores every usable answer in `cache` (set false to disable)
cache: cache/llm_cache.jsonl
api:
  base_url: ""                   # from the hackathon API docs (OpenAI-style chat completions assumed); or MUSE_BASE_URL
  key_env: MUSE_API_KEY
models:                          # tried in order per agent, e.g. contributor 1.3 then 1.2
  director: [muse-spark-1.3-contributor, muse-spark-1.2-contributor]
  narrator: [muse-spark-1.2-contributor]
# These are reasoning models: thinking tokens are spent out of max_tokens (a 200-token budget came back empty), so the
# budgets are generous. reasoning_effort (minimal|low|...) is accepted by the API and shortens the thinking.
params: {timeout: 60, temperature: 0.8, max_tokens: 4000, retries: 2, json_mode: true}   # json_mode: send response_format; auto-off if rejected
agent_params:
  director: {timeout: 90, max_tokens: 6000, reasoning_effort: low}
  narrator: {timeout: 30, max_tokens: 1500, reasoning_effort: low}
