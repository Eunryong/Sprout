<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout — raise a tiny mind</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28V14' stroke='%232e7d3f' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M16 16C16 10 11 7 5 7c0 6 5 9 11 9z' fill='%232e7d3f'/%3E%3Cpath d='M16 13c0-5 4-8 10-8 0 5-4 8-10 8z' fill='%237cc48a'/%3E%3C/svg%3E">
<meta name="theme-color" content="#edf1e8">
<style>
  :root {
    --bg: #edf1e8; --card: #ffffff; --ink: #222b22; --muted: #5e6d5d; --line: #d7e0cf; --accent: #2e7d3f; --accent-ink: #ffffff;
    --soft: #e1ebda; --focus: #2e7d3f;
    --c-solved: #2e7d3f; --c-partial: #8fb996; --c-nothing: #ccd2c4; --c-worse: #b0492f;
    --shadow: 0 1px 2px rgba(35, 50, 35, .07), 0 8px 22px rgba(35, 50, 35, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131714; --card: #1c221c; --ink: #e9ede5; --muted: #9aa79b; --line: #2d352d; --accent: #7cc48a; --accent-ink: #0f1a11;
      --soft: #232b23; --focus: #7cc48a;
      --c-solved: #7cc48a; --c-partial: #3f6b4a; --c-nothing: #4a524a; --c-worse: #d08a70; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131714; --card: #1c221c; --ink: #e9ede5; --muted: #9aa79b; --line: #2d352d; --accent: #7cc48a; --accent-ink: #0f1a11;
    --soft: #232b23; --focus: #7cc48a;
    --c-solved: #7cc48a; --c-partial: #3f6b4a; --c-nothing: #4a524a; --c-worse: #d08a70; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }
  header { padding: 20px 0 12px; }
  .masthead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .masthead h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; font-weight: 800; }
  .masthead .mark { display: inline-flex; width: 26px; height: 26px; }
  .masthead .mark svg { width: 100%; height: 100%; }
  .masthead .mark .stem { stroke: var(--accent); }
  .masthead .mark .leaf { fill: var(--accent); }
  .masthead .scene { color: var(--muted); font-size: 14px; }
  .masthead .spacer { flex: 1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chips:not(:has(> :not([hidden]))) { display: none; }
  .growth { height: 6px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); margin-top: 10px; overflow: hidden; }
  .growth span { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width .5s ease; }
  .premise { color: var(--muted); font-size: 14px; margin: 0 0 8px; font-style: italic; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.primary:hover:not(:disabled) { border-color: var(--accent); filter: brightness(.93); }
  button.quiet { border-color: transparent; background: transparent; color: var(--muted); font-size: 14px; padding: 6px 8px; }
  .story { background: var(--card); border-radius: 18px; padding: 24px 24px; box-shadow: var(--shadow); font-family: Georgia, "Noto Serif KR", "Apple SD Gothic Neo", serif; font-size: 20px; line-height: 1.7; margin-bottom: 18px; border: 1px solid var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin: 0 0 10px; align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .opts { display: grid; gap: 12px; margin: 0 0 14px; padding: 0; list-style: none; }
  .opt { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .opt.auto-opt { border-style: dashed; border-color: var(--accent); background: var(--soft); }
  .opt.solo-opt { border: 2px solid var(--accent); background: var(--soft); }
  .opt.solo-opt button { font-size: 15px; padding: 8px 18px; }
  .opt.thought-opt { border-color: var(--line); background: var(--card); }
  .opt.thought-opt h3 { color: var(--ink); font-weight: 500; font-size: 15px; line-height: 1.5; }
  .opt:hover { border-color: var(--accent); }
  .opt.chosen-opt { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(46,125,63,0.28); }
  .opt .speech { margin: 0 0 6px; font-size: 15px; color: var(--accent); font-weight: 600; }
  .opt h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  .opt .auto-desc { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  .result .child-said { margin: 0 0 8px; font-size: 15px; color: var(--accent); font-weight: 600; }
  .step-chip { font-size: 12px; font-weight: 600; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
  .cognitive-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--soft);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 2px 10px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: default;
    transition: all 0.2s ease;
  }
  .cognitive-badge:hover {
    box-shadow: 0 0 0 2px rgba(47, 93, 98, 0.2);
  }
  .knowledge-expansion {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 14px 0 10px;
    box-shadow: var(--shadow);
  }
  .knowledge-expansion .expansion-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .knowledge-expansion .expansion-item {
    font-size: 14px;
    margin: 6px 0;
    line-height: 1.5;
  }
  .knowledge-expansion .expansion-label {
    font-weight: 600;
    color: var(--ink);
    margin-right: 6px;
  }
  .knowledge-expansion .concept-tags {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
    vertical-align: middle;
  }
  .knowledge-expansion .concept-tag {
    font-size: 12px;
    font-weight: 600;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--accent);
    border-radius: 6px;
    padding: 1px 8px;
  }
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--soft); }
  .bar span { display: block; height: 100%; }
  .bar .solved { background: var(--c-solved); } .bar .partial { background: var(--c-partial); }
  .bar .nothing { background: var(--c-nothing); } .bar .worse { background: var(--c-worse); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; margin-top: 10px; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13px; color: var(--muted); }
  .foot .row button { padding: 5px 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt .row { flex-wrap: nowrap; }
  .lean { margin: 0 0 4px; font-size: 14px; color: var(--accent); font-weight: 600; }
  .memory { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 14px; }
  .result { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .result p { margin: 0 0 10px; }
  .result .who { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .result .world { font-style: italic; }
  .result .surprise { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  .result .learned { font-size: 13px; color: var(--muted); margin: 0; }
  .err { background: var(--soft); border: 1px solid var(--c-worse); color: var(--ink); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .stage { font-size: 12px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 9px; }
  .banner { background: var(--soft); border-radius: 14px; padding: 14px 18px; margin: 0 0 14px; border: 1px solid var(--line); }
  .banner h2 { margin: 0 0 2px; font-size: 15px; }
  .banner p { margin: 0; color: var(--muted); font-size: 14px; }
  .life { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
  .life h2 { margin: 0 0 4px; font-size: 22px; }
  .life ul { margin: 6px 0 14px; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .life li { margin: 2px 0; }
  .source { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .source b { color: var(--ink); font-weight: 600; }
  .source .warn { color: var(--c-worse); }
  .busy { color: var(--muted); font-size: 14px; }
  .custom-action-box {
    background: var(--card);
    border: 1px dashed var(--accent);
    border-radius: 14px;
    padding: 14px 16px;
    margin: 14px 0;
    box-shadow: var(--shadow);
  }
  .custom-action-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .custom-action-row {
    display: flex;
    gap: 8px;
  }
  .custom-action-input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  .custom-action-input:focus {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .qa-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin: 18px 0;
  }
  .qa-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .qa-title-group h2 {
    font-size: 18px;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .qa-subtitle {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }
  .qa-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .qa-chip {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--soft);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .qa-chip:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--card);
  }
  .qa-messages {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 280px;
    overflow-y: auto;
    padding: 12px;
    background: var(--soft);
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
  }
  .qa-msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.5;
    padding: 8px 12px;
    border-radius: 12px;
  }
  .qa-msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-ink);
    border-bottom-right-radius: 2px;
  }
  .qa-msg.child {
    align-self: flex-start;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-bottom-left-radius: 2px;
  }
  .qa-msg .badge {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.85;
    margin-bottom: 2px;
  }
  .qa-input-row {
    display: flex;
    gap: 8px;
  }
  .qa-input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  .qa-input:focus {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .growth span, .cognitive-badge, .qa-chip { transition: none; }
  }
  @media (max-width: 480px) {
    .masthead { gap: 8px; }
    .story { font-size: 18px; padding: 18px; }
    .row button { flex: 1; }
    .custom-action-row, .qa-input-row { flex-direction: column; }
    .qa-msg { max-width: 95%; }
  }
</style>
<script>window.SERVER_LANG = "__LANG__";</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="masthead">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="stem" d="M16 28V14" stroke-width="3" stroke-linecap="round" fill="none"/><path class="leaf" d="M16 16C16 10 11 7 5 7c0 6 5 9 11 9z"/><path d="M16 13c0-5 4-8 10-8 0 5-4 8-10 8z" fill="#7cc48a"/></svg></span>
      <h1>Sprout</h1>
      <span class="scene" id="sceneNo"></span>
      <span class="spacer"></span>
      <span class="busy" id="busy" role="status" hidden data-t="thinking"></span>
      <button class="quiet" id="langBtn" title="English / 한국어">한국어</button>
      <button class="primary" id="openQaBtn" data-t="openQaBtn">💬 아이와 대화하기 (마무리/질문)</button>
      <button class="quiet" id="newGame" data-t="newChild" data-title="newChildTitle"></button>
    </div>
    <div class="chips">
      <span class="stage" id="stageChip" hidden></span>
      <span class="step-chip" id="stepChip" hidden></span>
      <span class="cognitive-badge" id="cognitiveBadge" hidden></span>
    </div>
    <div class="growth" id="growth" role="img" hidden><span id="growthFill"></span></div>
  </header>
  <p class="premise" id="premise" hidden></p>
  <p class="source" id="source" hidden></p>
  <div class="err" id="err" role="alert" hidden></div>

  <div class="banner" id="adopt" hidden></div>
  <div class="banner" id="album" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <div class="story" id="story" aria-live="polite"></div>

  <section id="choose" hidden>
    <div id="sceneCard">
      <p class="legend" id="legend" hidden>
        <span data-t="guess"></span>
        <span><i style="background:var(--c-solved)"></i><span data-t="r_solved"></span></span>
        <span><i style="background:var(--c-partial)"></i><span data-t="r_partial"></span></span>
        <span><i style="background:var(--c-nothing)"></i><span data-t="r_nothing"></span></span>
        <span><i style="background:var(--c-worse)"></i><span data-t="r_worse"></span></span>
      </p>
      <div class="options" id="options">
        <ul class="opts" id="opts"></ul>
      </div>

      <div class="custom-action-box" id="customActionBox">
        <label class="custom-action-label" for="customActionInput" data-t="customActionLabel">또는 부모로서 직접 해주고 싶은 행동을 적어보세요</label>
        <div class="custom-action-row">
          <input type="text" id="customActionInput" class="custom-action-input" data-placeholder="customActionPlaceholder" placeholder="예: 공룡 동화책을 읽어주며 주인공 이야기를 나눈다 / 거품으로 장난치며 손을 씻겨준다" />
          <button class="primary" id="customActionBtn" data-t="customActionBtn">직접 행동하기</button>
        </div>
      </div>

      <div class="row"><button id="leave" data-t="leave"></button></div>
      <p class="hint" id="babyHint" hidden data-t="babyHint"></p>
      <p class="hint" id="hint" data-html="hint"></p>
    </div>
  </section>

  <section id="end" hidden>
    <div class="life" id="life"></div>
    <div class="row" style="margin-top:14px; gap:8px;">
      <button class="primary" id="again" data-t="again"></button>
      <button class="primary" id="summaryQaBtn" data-t="openQaBtn">💬 아이와 대화하기 (마무리/질문)</button>
    </div>
  </section>

  <section id="after" hidden>
    <div class="result" id="result" aria-live="polite"></div>
    <div class="row"><button class="primary" id="next" data-t="next"></button></div>
  </section>

  <section id="qaCard" class="qa-card" hidden>
    <div class="qa-header">
      <div class="qa-title-group">
        <h2 data-t="qaTitle">아이에게 질문하기 (Child Q&A & Growth Check)</h2>
        <p class="qa-subtitle" data-t="qaSubtitle">지금까지 겪은 경험과 학습한 기억을 바탕으로 아이가 직접 대답해요.</p>
      </div>
      <button class="quiet" id="qaCloseBtn" data-t="qaCloseBtn">✕ 게임으로 돌아가기</button>
    </div>

    <div class="qa-chips" id="qaChips">
      <button type="button" class="primary" id="runQuizBtn" data-t="quizBtn">🧩 안 배운 낯선 상황 3개 퀴즈 대결 (LLM 개입 없음)</button>
      <button type="button" class="qa-chip" data-q-ko="엄마/아빠랑 함께한 것 중에 뭐가 제일 기억에 남아?" data-q-en="What do you remember most about being with mom/dad?">엄마/아빠랑 함께한 것 중에 뭐가 제일 기억에 남아?</button>
      <button type="button" class="qa-chip" data-q-ko="심심하거나 속상할 때는 어떻게 하고 싶어?" data-q-en="What do you want to do when you're bored or upset?">심심하거나 속상할 때는 어떻게 하고 싶어?</button>
      <button type="button" class="qa-chip" data-q-ko="책을 읽거나 놀면서 어떤 걸 해보고 싶었어?" data-q-en="What did you want to try while reading books or playing?">책을 읽거나 놀면서 어떤 걸 해보고 싶었어?</button>
      <button type="button" class="qa-chip" data-q-ko="친구가 울고 있거나 도움이 필요하면 어떻게 할 거야?" data-q-en="What will you do if a friend is crying or needs help?">친구가 울고 있거나 도움이 필요하면 어떻게 할 거야?</button>
    </div>

    <div class="banner" id="quizBox" hidden></div>

    <div class="qa-messages" id="qaMessages"></div>

    <div class="qa-input-row">
      <input type="text" id="qaInput" class="qa-input" data-placeholder="qaInputPlaceholder" placeholder="아이에게 물어보고 싶은 말을 적어보세요..." />
      <button class="primary" id="qaSendBtn" data-t="qaSendBtn">질문하기</button>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const RES = ["solved", "partial", "nothing", "worse"];

// Every word the page itself shows, in both languages. The scene text comes from the server in the language it speaks.
const TEXT = {
  en: {
    thinking: "the child is thinking…", newChild: "New child", newChildTitle: "Start a new child. The current one is kept on disk.",
    guess: "The child’s guess:", r_solved: "solved", r_partial: "partial", r_nothing: "nothing", r_worse: "worse",
    leave: "Leave it to the child", choose: "Choose", babyBtn: "Choose", pickBtn: "Choose", tell: "Tell", show: "Show", showBtn: "Choose", sayBtn: "Choose", soloTry: "Let the child try this", again: "Raise another child", next: "Next scene", nextStep: "Next: Child's solo moment →", nextSolo: "Next: Child's solo moment →",
    step1: "1/2 · Parent demonstrates", step2: "2/2 · Child chooses alone",
    step1Badge: "1/2 · Parent demonstrates", step1SayBadge: "1/2 · Advise the child in words", step2Badge: "2/2 · Child chooses alone",
    leaveTitle: "Let the child try first",
    autoStep1Title: "Let the child try first",
    autoStep1Desc: "Step back and watch without giving an answer. The child decides on its own and learns more deeply from what happens next.",
    autoStep1Btn: "Let the child try alone",
    autoStep1SayTitle: "Let the child try what it thinks",
    autoStep1SayDesc: "Without giving separate advice, let the child try first based on what it currently knows",
    autoStep1SayBtn: "Let the child try alone",
    soloLeaveTitle: "Child chooses on its own",
    autoStep2Title: "Child chooses on its own",
    soloLeaveDesc: "Facing a new situation, the child tries an unfamiliar action on its own and learns from what happens.",
    autoStep2Desc: "Facing a new situation, the child tries an unfamiliar action on its own and learns from what happens.",

let LANG = "en";
try { LANG = localStorage.getItem("lang") || window.SERVER_LANG || "en"; } catch (_) { LANG = window.SERVER_LANG || "en"; }
if (!TEXT[LANG]) LANG = "en";
const t = (k, ...a) => { const v = TEXT[LANG][k]; return typeof v === "function" ? v(...a) : v; };

function applyText() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll("[data-html]").forEach((e) => { e.innerHTML = t(e.dataset.html); });
  document.querySelectorAll("[data-title]").forEach((e) => { e.title = t(e.dataset.title); });
  document.querySelectorAll("[data-placeholder]").forEach((e) => { e.placeholder = t(e.dataset.placeholder); });
  document.querySelectorAll(".qa-chip").forEach((btn) => {
    btn.textContent = LANG === "ko" ? btn.dataset.qKo : btn.dataset.qEn;
  });
  $("langBtn").textContent = t("other");
  if (currentCognitive) {
    updateCognitiveBadge(currentCognitive);
  }
}

let busy = false;

function formatCognitiveTier(c, lang) {
  if (!c) return "";
  const scale = c.scale_b != null ? `${c.scale_b}B` : "1B";
  let tierDesc = "";
  if (c.tier_name) {
    const match = c.tier_name.match(/\((.*?)\)/);
    if (match) {
      tierDesc = match[1];
    } else {
      tierDesc = c.tier_name.replace(/^[0-9.]+B\s*·?\s*/, "");
    }
  }
  if (!tierDesc) {
    const s = c.scale_b || 1.0;
    if (s < 2.0) tierDesc = lang === "ko" ? "3세 · 단편 직관" : "Age 3 · Simple Intuition";
    else if (s < 3.5) tierDesc = lang === "ko" ? "4세 · 개념 형성" : "Age 4 · Concept Formation";
    else if (s < 5.0) tierDesc = lang === "ko" ? "5세 · 인과 연결" : "Age 5 · Causal Linking";
    else if (s < 6.2) tierDesc = lang === "ko" ? "6세 · 경험 결합" : "Age 6 · Experience Synthesis";
    else tierDesc = lang === "ko" ? "7세 · 원리 일반화" : "Age 7 · Principle Generalization";
  }
  return `${scale} (${tierDesc})`;
}

function updateCognitiveBadge(c) {
  const badge = $("cognitiveBadge");
  if (!badge) return;
  if (!c) {
    badge.hidden = true;
    return;
  }
  currentCognitive = c;
  const tier = formatCognitiveTier(c, LANG);
  const nConcepts = c.n_concepts ?? 0;
  const nPrinciples = c.n_principles ?? 0;
  badge.textContent = t("cognitiveBadge", tier, nConcepts, nPrinciples);

  const recents = Array.isArray(c.recent_principles) && c.recent_principles.length > 0 ? c.recent_principles : [];
  const hops = c.reasoning_hops != null ? (LANG === "ko" ? `추론 홉: ${c.reasoning_hops}` : `Reasoning Hops: ${c.reasoning_hops}`) : "";
  const episodes = c.n_episodes != null ? (LANG === "ko" ? `에피소드: ${c.n_episodes}` : `Episodes: ${c.n_episodes}`) : "";
  const details = [hops, episodes].filter(Boolean).join(" · ");
  let title = badge.textContent;
  if (details) title += `\n(${details})`;
  if (recents.length > 0) {
    title += (LANG === "ko" ? `\n\n[최근 합성된 원리]:\n- ` : `\n\n[Recent Principles]:\n- `) + recents.join("\n- ");
  }
  badge.title = title;
  badge.hidden = false;
}

function setPhase(phase) {
  const box = $("customActionBox");
  if (!box) return;
  const isScene = phase === "scene";
  box.hidden = !isScene;
  const input = $("customActionInput");
  const btn = $("customActionBtn");
  if (input) input.disabled = !isScene;
  if (btn) btn.disabled = !isScene;
}

function setBusy(on) {
  busy = on;
  $("busy").hidden = !on;
  document.querySelectorAll("button").forEach((b) => {
    if (b.id !== "runQuizBtn" && b.id !== "qaSendBtn" && b.id !== "qaCloseBtn" && !b.classList.contains("qa-chip")) {
      b.disabled = on;
    }
  });
  if (on) {
    const customIn = $("customActionInput");
    if (customIn) customIn.disabled = true;
    const customBtn = $("customActionBtn");
    if (customBtn) customBtn.disabled = true;
  }
}
function showErr(msg) { const e = $("err"); e.textContent = msg || ""; e.hidden = !msg; }

  let r;
  try {
    r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch (_) {
    throw new Error(t("errReach"));
  }
  if (!r.ok) {
    let m = r.statusText;
    try { m = (await r.json()).detail || m; } catch (_) {}
    throw new Error(m);
  }
  return r.json();
}

function showSource(info) {

function pct(x) { return Math.round(x * 100) + "%"; }

const RESEARCH = new URLSearchParams(location.search).has("research");  // the child's raw numbers, for the researcher only
if (RESEARCH) document.body.classList.add("research");

let CAN_ACT = true;

function optionCard(o, sc) {
  const li = document.createElement("li");
  li.className = "opt";
  const isResearch = document.body.classList.contains("research");
  const lived = (isResearch && o.seen === 0) ? t("newToChild") : "";
  const lean = o.lean === "remembers" ? t("leanRemembers") : o.lean === "curious" ? t("leanCurious") : "";
  let research = "";
  if (isResearch) {
    const top = RES.reduce((a, b) => (o.expects[a] >= o.expects[b] ? a : b));
    const bars = RES.map((r) => `<span class="${r}" style="width:${(o.expects[r] * 100).toFixed(1)}%" title="${r} ${pct(o.expects[r])}"></span>`).join("");
    research = `<div class="bar" role="img">${bars}</div><div class="meta"><span>${t("guessR", top, pct(o.expects[top]))}</span><span>${t("curiosityR")}${o.pull.toFixed(2)}</span></div>`;
  }
  const isStep1 = sc && sc.step_total === 2 && sc.step === 1;
  const isStep2 = sc && sc.step === 2;
  const canSpeak = Boolean(sc && sc.can_act && sc.age_months >= 36);

  if (isStep2) {
    // Step 2: Child is facing the situation alone and thinking about candidate actions
    li.className = "opt thought-opt";
    const thoughtText = o.speech || (o.text.charAt(0).toUpperCase() + o.text.slice(1));
    const leanHtml = lean ? '<p class="lean"></p>' : "";
    const memHtml = o.memory ? '<p class="memory"></p>' : "";
    const livedHtml = lived ? `<span>${lived}</span>` : "";
    li.innerHTML = `<h3></h3>${leanHtml}${memHtml}${research}
      <div class="foot"><div class="meta">${livedHtml}</div></div>`;
    li.querySelector("h3").textContent = thoughtText;
    if (lean) li.querySelector(".lean").textContent = lean;
    if (o.memory) li.querySelector(".memory").textContent = o.memory;
    return li;
  }

  // Step 1 or single-step (baby): Parent demonstrates in 2-step (Step 1), advises in words (36m+ single step), demonstrates (12-35m), or does it for baby (0-11m)
  const isBaby = !sc || !sc.can_act;
  const part = isStep1 ? "show" : (canSpeak ? "say" : "show");
  const btnLabel = isStep1 ? t("showBtn") : (isBaby ? t("babyBtn") : (canSpeak ? t("sayBtn") : t("choose")));
  const btns = `<button class="primary" data-part="${part}">${btnLabel}</button>`;
  const leanHtml = lean ? '<p class="lean"></p>' : "";
  const memHtml = o.memory ? '<p class="memory"></p>' : "";
  const livedHtml = lived ? `<span>${lived}</span>` : "";
  const mainLine = o.text ? (o.text.charAt(0).toUpperCase() + o.text.slice(1)) : "";
  li.innerHTML = `<h3></h3>${leanHtml}${memHtml}${research}
    <div class="foot"><div class="meta">${livedHtml}</div>
    <div class="row">${btns}</div></div>`;
  li.querySelector("h3").textContent = mainLine;
  if (lean) li.querySelector(".lean").textContent = lean;
  if (o.memory) li.querySelector(".memory").textContent = o.memory;
  li.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => play(b.dataset.part, o.index)));
  return li;
}

function autonomousCard(sc) {
  const li = document.createElement("li");
  const isStep2 = sc && sc.step === 2;
  const canSpeak = Boolean(sc && sc.can_act && sc.age_months >= 36);

async function chooseChild() {
  return new Promise((resolve) => {
    const box = $("adopt");
    const nameLabel = Object.assign(document.createElement("label"), { textContent: t("adoptNameLabel"), className: "custom-action-label" });
    nameLabel.htmlFor = "childNameInput";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.id = "childNameInput";
    nameInput.className = "custom-action-input";
    nameInput.placeholder = t("adoptNamePlaceholder");
    nameInput.style.margin = "0 0 10px";
    nameInput.style.width = "100%";
    const go = async (persona) => {
      const name = nameInput ? (nameInput.value || "").trim() : "";
      box.hidden = true;
      setBusy(true);
      try {
        const r = await api("/api/new", { persona, name });
        if (r && r.restarting) {  // another world: the game starts again in it, then this page reloads
          box.replaceChildren(Object.assign(document.createElement("h2"), { textContent: t("restarting") }));
          box.hidden = false;
          for (let i = 0; i < 60; i++) {
            await new Promise((ok) => setTimeout(ok, 1000));
            const up = await fetch("/api/info").then((x) => x.ok).catch(() => false);
            if (up && i > 1) { location.reload(); return; }
          }
        }
      } catch (e) { showErr(e.message); }
      setBusy(false);
      resolve(true);
    };
    const btn = (label, fn, cls) => { const b = Object.assign(document.createElement("button"), { textContent: label, className: cls || "" }); b.style.margin = "4px 6px 0 0"; b.addEventListener("click", fn); return b; };

      Object.assign(document.createElement("h2"), { textContent: t("adoptTitle") }),
      Object.assign(document.createElement("p"), { textContent: t("adoptSub") }),
      nameLabel,
      nameInput,
      ...items.map((item) => btn(item.label, () => go(item.id), "primary")),
      btn(t("cancel"), () => { box.hidden = true; resolve(false); }, "quiet")
    );
    box.hidden = false;
  });
}

async function loadScene(opts = {}) {
  showErr("");
  setBusy(true);
  const keep = Boolean(opts && opts.keepScreen);
  if (!keep) lastResult = null;
  let tick = null;
  if (!keep) {
    $("story").hidden = false; $("end").hidden = true;
    const t0 = Date.now();
    tick = setInterval(() => { $("story").textContent = t("writing", Math.round((Date.now() - t0) / 1000)); }, 500);
    $("story").textContent = t("writing0");
    $("choose").hidden = true; $("after").hidden = true;
  }
  try {
    const [sc, info] = await Promise.all([api("/api/scene"), api("/api/info")]);
    currentAgeText = sc.age;
    currentChildName = (info && info.child_name) || null;
    const cog = sc.cognitive || sc.cognitive_status || (info && info.cognitive);
    if (cog) updateCognitiveBadge(cog);
    if (Array.isArray(info.qa_history)) renderQaHistory(info.qa_history);
    try {
      if (sessionStorage.getItem("qaOpen") === "1" && info.qa_history && info.qa_history.length > 0) $("qaCard").hidden = false;
    } catch (_) {}
    $("sceneNo").textContent = sc.ended ? "" : t("scene", sc.age, sc.number, currentChildName);
    const gr = $("growth"), gf = $("growthFill");
    if (gr && gf) {  // the growing line: where this child is between birth and seven
      gr.hidden = false;
      gf.style.width = sc.ended ? "100%" : Math.round(Math.min(1, Math.max(0, (sc.age_months || 36) / 84)) * 100) + "%";
      gr.setAttribute("aria-label", sc.age || "");
    }
    const chip = $("stageChip"); chip.hidden = !sc.stage; if (sc.stage) chip.textContent = sc.stage.name;
    const stepChip = $("stepChip");
    stepChip.hidden = sc.ended || !(sc.step_total && sc.step_total > 1);
    if (!stepChip.hidden) stepChip.textContent = sc.step === 2 ? t("step2Badge") : (sc.age_months >= 36 ? t("step1SayBadge") : t("step1Badge"));
    const p = $("premise"); p.textContent = info.premise; p.hidden = !info.premise;
    if (RESEARCH) showSource(info);  // who wrote what, counted since the server started: for the researcher, not the player
    await showAlbum(info);
    if (sc.ended) { if (tick) clearInterval(tick); await showEnd(); setBusy(false); return; }
    CAN_ACT = sc.can_act;
    stageBanner(sc);
    $("story").textContent = sc.narration;
    const cards = sc.options.map((o) => optionCard(o, sc));
    if (CAN_ACT && sc.step !== 2) cards.push(autonomousCard(sc));
    const ul = $("opts"); ul.replaceChildren(...cards);
    $("legend").hidden = !RESEARCH;
    $("leave").hidden = true; $("hint").hidden = !CAN_ACT; $("babyHint").hidden = CAN_ACT;
    if (CAN_ACT) {
      if (sc.step_total === 2 && sc.step === 1) $("hint").innerHTML = sc.age_months >= 36 ? t("hintSay") : t("hintShow");
      else if (sc.step === 2) $("hint").innerHTML = t("hintSolo");
      else $("hint").innerHTML = sc.age_months >= 36 ? t("hintSay") : t("hint");
    }
    $("choose").hidden = false; $("after").hidden = true;
    setPhase("scene");
    if (sc.step === 2) {
      if (tick) { clearInterval(tick); tick = null; }
      await play("leave", null, { autoStep2: true });
    }
  } catch (e) { showErr(t("errScene") + e.message); }
  if (tick) clearInterval(tick);
  setBusy(false);
}

function resultCard(r) {
  const who = r.part === "show" ? t("whoShow")
    : (r.part === "solo" || r.step === 2) ? t("whoSolo")
    : r.part === "say" ? (r.followed ? t("whoSayFollowed") : t("whoSayIgnored"))
    : r.part === "leave" ? t("whoLeave")
    : r.followed ? t("whoFollowed") : t("whoOther");
  const el = document.createElement("div");
  const add = (cls, text) => { const p = document.createElement("p"); if (cls) p.className = cls; p.textContent = text; el.appendChild(p); };
  add("who", who);
  if (r.child_said) add("child-said", `💬 ${r.child_said}`);
  add("", r.narration || r.happened || "");
  if (r.world_says) add("world", r.world_says);
  if (r.explanation && RESEARCH) add("surprise", t("research") + r.explanation);  // the child's guess against what happened: for the researcher, not the player
  if (r.remembers) add("learned", r.remembers);
  else if (!RESEARCH && r.learned) add("learned", r.learned);
  if (r.newborn_line) add("learned newborn-compare", r.newborn_line);
  if (r.newborn_pick_text != null) add("learned", t("newbornLine", r.newborn_pick_text));
  if (RESEARCH) add("learned", t("learnedR", r.learned));

  // Knowledge Expansion box (synthesized_principle or expanded_concepts)
  const synthPrinciple = r.synthesized_principle || (r.turn && r.turn.synthesized_principle);
  const expConcepts = r.expanded_concepts || r.new_concepts || (r.turn && (r.turn.expanded_concepts || r.turn.new_concepts));
  const hasSynth = Boolean(synthPrinciple && (typeof synthPrinciple === "string" ? synthPrinciple.trim() : true));
  const hasExp = Boolean(Array.isArray(expConcepts) ? expConcepts.length > 0 : expConcepts);

  if (hasSynth || hasExp) {
    const box = document.createElement("div");
    box.className = "knowledge-expansion";

    const title = document.createElement("div");
    title.className = "expansion-title";
    title.textContent = t("expansionTitle");
    box.appendChild(title);

    if (hasSynth) {
      const prinText = typeof synthPrinciple === "object" ? (synthPrinciple.principle || synthPrinciple.text || JSON.stringify(synthPrinciple)) : String(synthPrinciple);
      const row = document.createElement("div");
      row.className = "expansion-item";
      const lbl = document.createElement("span");
      lbl.className = "expansion-label";
      lbl.textContent = `${t("expansionPrinciple")}:`;
      const val = document.createElement("span");
      val.className = "expansion-text";
      val.textContent = ` ${prinText}`;
      row.appendChild(lbl);
      row.appendChild(val);
      box.appendChild(row);
    }

    if (hasExp) {
      const conceptList = (Array.isArray(expConcepts) ? expConcepts : [expConcepts])
        .map((c) => (typeof c === "object" ? (c.name || c.concept || JSON.stringify(c)) : String(c).trim()))
        .filter(Boolean);
      if (conceptList.length > 0) {
        const row = document.createElement("div");
        row.className = "expansion-item";
        const label = document.createElement("span");
        label.className = "expansion-label";
        label.textContent = `${t("expansionConcepts")}: `;
        row.appendChild(label);

        const tags = document.createElement("span");
        tags.className = "concept-tags";
        conceptList.forEach((c) => {
          const tag = document.createElement("span");
          tag.className = "concept-tag";
          tag.textContent = c;
          tags.appendChild(tag);
        });
        row.appendChild(tags);
        box.appendChild(row);
      }
    }

    const whatLearned = r.what_learned || (r.turn && r.turn.what_learned) || r.remembers || r.learned;
    if (whatLearned) {
      const row = document.createElement("div");
      row.className = "expansion-item";
      const lbl = document.createElement("span");
      lbl.className = "expansion-label";
      lbl.textContent = `${t("expansionLearned")}:`;
      const val = document.createElement("span");
      val.className = "expansion-text";
      val.textContent = ` ${whatLearned}`;
      row.appendChild(lbl);
      row.appendChild(val);
      box.appendChild(row);
    }

    el.appendChild(box);
  }

  return el;
}

let lastResult = null;

async function play(partOrIndex, optionOrCustom, opts = {}) {
  let part = "say";
  let option = 0;
  let custom_text = null;
  if (typeof partOrIndex === "number") {
    option = partOrIndex;
    if (typeof optionOrCustom === "string") {
      custom_text = optionOrCustom;
    }
  } else {
    part = partOrIndex;
    option = optionOrCustom;
    if (opts && opts.custom_text) custom_text = opts.custom_text;
  }
  if (busy && !opts.autoStep2) return;
  showErr("");
  setBusy(true);
  setPhase("outcome");
  try {
    const payload = {
      part: part,
      option: option ?? null,
      option_index: typeof option === "number" ? option : 0,
    };
    if (custom_text) {
      payload.custom_text = custom_text;
    }
    const r = await api("/api/play", payload);
    lastResult = r;
    const cog = r.cognitive || r.cognitive_status;
    if (cog) updateCognitiveBadge(cog);
    $("result").replaceChildren(...resultCard(r).children);
    if (opts.autoStep2 || r.step === 2) {
      $("choose").hidden = false;
      const optsEl = $("opts");
      if (optsEl && r.acted != null && optsEl.children[r.acted]) {
        optsEl.children[r.acted].classList.add("chosen-opt");
      }
      $("next").textContent = t("next");
    } else {
      $("choose").hidden = true;
      $("next").textContent = r.has_next_step ? t("nextStep") : t("next");
    }
    $("after").hidden = false;
    setBusy(false);
    $("next").focus();
  } catch (e) { setBusy(false); showErr(t("errPlay") + e.message); }
}

function clearInputCleanly(input) {
  if (!input) return;
  const hadFocus = document.activeElement === input;
  input.blur(); // forces IME compositionend synchronously before clearing
  input.value = "";
  if (hadFocus) input.focus();
  setTimeout(() => { input.value = ""; }, 0);
  requestAnimationFrame(() => { input.value = ""; });
}

function readAndClearInput(input) {
  if (!input) return "";
  const hadFocus = document.activeElement === input;
  input.blur(); // commits any active IME composition into input.value
  const text = input.value.trim();
  input.value = "";
  if (hadFocus) input.focus();
  setTimeout(() => { input.value = ""; }, 0);
  requestAnimationFrame(() => { input.value = ""; });
  return text;
}

function doCustomAction(customText) {
  const input = $("customActionInput");
  let text = typeof customText === "string" ? customText.trim() : "";
  if (text) {
    clearInputCleanly(input);
  } else {
    text = readAndClearInput(input);
  }
  if (!text) return;
  play(0, text);
}
if ($("customActionBtn")) $("customActionBtn").addEventListener("click", () => doCustomAction());
if ($("customActionInput")) $("customActionInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229) {
      const val = readAndClearInput(e.target);
      if (val) doCustomAction(val);
      return;
    }
    doCustomAction();
  }
});

function renderQaHistory(history) {

  for (const item of history) {

    userMsg.className = "qa-msg user";
    userMsg.innerHTML = `<span class="badge">${t("qaUserBadge")}</span><div class="qa-bubble-text"></div>`;
    userMsg.querySelector(".qa-bubble-text").textContent = item.question || "";
    msgs.appendChild(userMsg);

    const childMsg = document.createElement("div");
    childMsg.className = "qa-msg child";
    let ageBadge = item.age || currentAgeText || (LANG === "ko" ? "성장 중" : "growing");
    if (currentCognitive && currentCognitive.personality && currentCognitive.personality.label) {
      ageBadge += ` · ${currentCognitive.personality.label}`;
    }
    childMsg.innerHTML = `<span class="badge">${t("qaChildBadge", ageBadge)}</span><div class="qa-bubble-text"></div>`;
    childMsg.querySelector(".qa-bubble-text").textContent = item.answer || "";

  }

async function sendQa(qText) {
  if (qaBusy) return;
  const input = $("qaInput");
  let text = typeof qText === "string" ? qText.trim() : "";
  if (text) {
    clearInputCleanly(input);
  } else {
    text = readAndClearInput(input);
  }
  if (!text) return;
  qaBusy = true;
  const sendBtn = $("qaSendBtn");
  if (sendBtn) sendBtn.disabled = true;

  const msgs = $("qaMessages");
  const userMsg = document.createElement("div");
  userMsg.className = "qa-msg user";
  userMsg.innerHTML = `<span class="badge">${t("qaUserBadge")}</span><div class="qa-bubble-text"></div>`;
  userMsg.querySelector(".qa-bubble-text").textContent = text;
  msgs.appendChild(userMsg);

  const pendingMsg = document.createElement("div");
  pendingMsg.className = "qa-msg child";
  let pendingAge = currentAgeText || (LANG === "ko" ? "성장 중" : "growing");
  if (currentCognitive && currentCognitive.personality && currentCognitive.personality.label) {
    pendingAge += ` · ${currentCognitive.personality.label}`;
  }
  pendingMsg.innerHTML = `<span class="badge">${t("qaChildBadge", pendingAge)}</span><div class="qa-bubble-text" style="font-style:italic">${t("qaThinking")}</div>`;
  msgs.appendChild(pendingMsg);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const res = await api("/api/ask", { question: text });
    let ageLabel = res.age || currentAgeText || (LANG === "ko" ? "성장 중" : "growing");
    if (currentCognitive && currentCognitive.personality && currentCognitive.personality.label) {
      ageLabel += ` · ${currentCognitive.personality.label}`;
    }
    pendingMsg.querySelector(".badge").textContent = t("qaChildBadge", ageLabel);
    const bodyEl = pendingMsg.querySelector(".qa-bubble-text");
    bodyEl.style.fontStyle = "normal";
    bodyEl.textContent = res.answer || "...";
  } catch (err) {
    pendingMsg.querySelector(".qa-bubble-text").textContent = t("errPlay") + err.message;
  } finally {
    qaBusy = false;
    if (sendBtn) sendBtn.disabled = false;
    msgs.scrollTop = msgs.scrollHeight;
  }
}

if ($("qaSendBtn")) $("qaSendBtn").addEventListener("click", () => sendQa());
if ($("qaInput")) $("qaInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (qaBusy) return;
    if (e.isComposing || e.keyCode === 229) {
      const val = readAndClearInput(e.target);
      if (val) sendQa(val);
      return;
    }
    sendQa();
  }
});

let quizOffset = 0;
async function runQuiz(offset = 0) {
  let box = $("quizBox");
  if (!box && $("qaCard")) {
    box = document.createElement("div");
    box.id = "quizBox";
    box.className = "banner";
    const msgs = $("qaMessages");
    if (msgs && msgs.parentNode) msgs.parentNode.insertBefore(box, msgs);
    else $("qaCard").appendChild(box);
  }
  if (!box) return;
  box.hidden = false;
  box.replaceChildren(Object.assign(document.createElement("p"), { className: "memory", textContent: t("qaThinking") }));
  try {
    const data = await api(`/api/quiz?offset=${encodeURIComponent(offset)}`);
    box.replaceChildren();
    const h = document.createElement("h2");
    h.textContent = data.title || "";
    const sub = document.createElement("p");
    sub.textContent = data.subtitle || "";
    box.append(h, sub);
    const ul = document.createElement("ul");
    ul.className = "opts";
    ul.style.marginTop = "10px";
    for (const it of (data.items || [])) {
      const li = document.createElement("li");
      li.className = "opt";
      const title = document.createElement("h3");
      title.textContent = `${it.index}. ${it.situation}`;
      li.appendChild(title);
      for (const o of (it.options || [])) {
        const p = document.createElement("p");
        p.className = "memory";
        const mark = (o.is_child_pick && o.is_newborn_pick) ? "🌱👶 " : o.is_child_pick ? "🌱 " : o.is_newborn_pick ? "👶 " : "• ";
        p.textContent = `${mark}${o.text} [${o.feel_tag}]${o.memory ? ` — ${o.memory}` : ""}`;
        li.appendChild(p);
      }
      if (it.comparison_line) {
        const cmp = document.createElement("p");
        cmp.className = "lean";
        cmp.textContent = it.comparison_line;
        li.appendChild(cmp);
      }
      if (it.happened) {
        const hap = document.createElement("p");
        hap.className = "memory";
        hap.textContent = `→ ${it.happened}`;
        li.appendChild(hap);
      }
      ul.appendChild(li);
    }
    box.appendChild(ul);
    const row = document.createElement("div");
    row.className = "row";
    const moreBtn = document.createElement("button");
    moreBtn.className = "primary";
    moreBtn.textContent = t("quizMoreBtn");
    moreBtn.addEventListener("click", () => { quizOffset += 1; runQuiz(quizOffset); });
    const closeBtn = document.createElement("button");
    closeBtn.className = "quiet";
    closeBtn.textContent = t("quizCloseBtn");
    closeBtn.addEventListener("click", () => { box.hidden = true; });
    row.append(moreBtn, closeBtn);
    box.appendChild(row);
  } catch (e) {
    box.replaceChildren(Object.assign(document.createElement("p"), { className: "memory", textContent: t("errPlay") + e.message }));
  }
}

if ($("runQuizBtn")) $("runQuizBtn").addEventListener("click", () => { quizOffset = 0; runQuiz(0); });

applyText();
chooseLang(LANG).then(loadScene);
</script>
</body>
</html>
