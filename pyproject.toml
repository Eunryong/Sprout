[project]
name = "sprout"
version = "0.0.1"
description = "Raise a tiny transformer child by choosing actions in situations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "torch>=2.5",
    "pydantic>=2.8",
    "pyyaml>=6",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = []
